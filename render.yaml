databases:
  - name: chemviz-db
    plan: free
    databaseName: chemviz
    user: chemviz_user

services:
  - type: web
    name: chemviz
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && cd client && npm install && npm run build
    startCommand: gunicorn --bind=0.0.0.0:5000 main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chemviz-db
          property: connectionURI
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PORT
        value: "5000"
